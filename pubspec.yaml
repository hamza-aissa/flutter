name: waiting_room_app
description: Application de gestion de salle d'attente avec sync offline/online
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase pour base de données cloud
  supabase_flutter: ^2.10.3
  
  # SQLite pour stockage local
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Gestion d'état
  provider: ^6.1.0
  flutter_dotenv: ^5.1.0
  
  # Géolocalisation
  geolocator: ^10.1.0
  
  # UUID
  uuid: ^4.2.0
  
  # Vérification de connexion Internet
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
